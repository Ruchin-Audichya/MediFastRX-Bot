# Fly.io: `fly launch --no-deploy`, `fly volumes create medifast_data --size 1`, set secrets, then `fly deploy`.
app = "medifast-demo"
primary_region = "bom"

[build]

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/medifast.db"
  DEMO_MODE = "true"

[[mounts]]
  source = "medifast_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # the bot must stay up to receive webhooks and run expiry
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "3s"
